[project]
name = "cfdi-agent"
version = "0.1.0"
description = "Accounts-payable agent for Mexican CFDI invoices: deterministic parsing, anomaly detection, and an NL agent over Postgres."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "lxml>=5.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
llm = [
    "anthropic>=0.69",
]
synth = [
    "jinja2>=3.1",
    "faker>=30.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]
dashboard = [
    "streamlit>=1.40",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
