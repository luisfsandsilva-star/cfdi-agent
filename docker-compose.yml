services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cfdi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cfdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfdi}
      POSTGRES_DB: ${POSTGRES_DB:-cfdi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, on first init of an empty volume. To re-apply after edits:
      #   docker compose down -v && docker compose up -d
      # or: python -m cfdi_agent.db.init  (idempotent, no volume wipe)
      - ./src/cfdi_agent/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfdi} -d ${POSTGRES_DB:-cfdi}"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    # Pin this after the first successful boot:
    #   docker compose exec n8n n8n --version   → set N8N_VERSION in .env
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: cfdi-n8n
    restart: unless-stopped
    environment:
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Monterrey
      TZ: America/Monterrey
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./flows/exported:/flows:ro
    # Lets n8n reach the FastAPI app running on the host during development
    # (http://host.docker.internal:8000). Required on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local inference. Opt-in, because the deterministic pipeline needs none of
  # it: this serves detector 2's embeddings and the tier-1 vision model, and
  # tier 0 runs without either.
  #
  # CPU is enough for embeddings. Embedding a line-item description is
  # milliseconds; this does not need the Orin, and running it here is what
  # makes detector 2 measurable without any other hardware.
  #
  # The same service also serves the tier-1 vision model, and that one does
  # want a GPU:
  #
  #   docker compose --profile embeddings up -d
  #   docker compose exec embeddings ollama pull bge-m3
  #   docker compose exec embeddings ollama pull qwen2.5vl:7b
  #
  # bge-m3 is multilingual, strong on Spanish, and returns 1024 dimensions,
  # which is what `line_items.embedding` is declared as. A model with a
  # different width fails loudly in `embed_invoice` rather than corrupting the
  # index. Ollama speaks the OpenAI API for both, so no code changes.
  embeddings:
    image: ollama/ollama
    container_name: cfdi-ollama
    profiles: ["embeddings"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # 4096 is the Ollama default and a rasterized invoice page does not fit
      # in it: one letter-size page at 200 DPI is ~4200 image tokens before a
      # single word of prompt. The first attempt failed with "request (4220
      # tokens) exceeds the available context size (4096 tokens)".
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama:/root/.ollama
    # Optional. Without a GPU present Ollama runs on CPU and everything still
    # works — embeddings are unaffected, and the vision model is the only thing
    # that becomes impractical. Docker Compose ignores this block when no
    # nvidia runtime is installed, so it is safe to leave in place.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  n8ndata:
  ollama:
